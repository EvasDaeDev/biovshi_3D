<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ЭКЦЕПРИ / Lab Next 3D</title><style>body{margin:0;background:#0b1410;color:#c4d5c8;font:14px system-ui}#hud{position:fixed;top:12px;left:12px;max-width:min(456px,calc(100vw - 24px));background:#0b1410e8;padding:12px;z-index:1}#stats{position:fixed;left:12px;right:12px;bottom:12px;max-height:18vh;overflow:auto;margin:0;padding:8px 12px;background:#0b1410e8;font-size:12px}button,a{color:#c4d5c8;background:#20382b;padding:6px}canvas{display:block}</style></head><body><div id="hud"><b>ЭКЦЕПРИ 3D / СТЕНД</b><p id="scene-hint">Бой пациентов под управлением ИИ.</p><button id="pause">Пауза</button> <button id="frame-step" disabled title="Один физический тик 1/60 с">+1 кадр</button> <label>Скорость: <select id="playback-rate"><option value="1">1×</option><option value="0.5">0.5×</option><option value="0.25">0.25×</option></select></label> <button id="reset">Сброс</button> <button id="next-round" title="После окончания боя и остановки физических тел сохранить пол">Следующий раунд (сохранить пол)</button> <a href="./">Карта</a> <a href="./pose-editor.html">Редактор поз</a><p><label>Сценарий: <select id="scenario"><option value="location-ring">Ринг · ⌀ 7 м</option><option value="motion-review">P4-M · просмотр движений без боя (2)</option><option value="normal">Обычный</option><option value="duel">Бой 1 на 1 (руки)</option><option value="duel-mixed">Бой 1 на 1 (руки, ноги, голова)</option><option value="duel-traits">Бой 1 на 1 (характеристики)</option><option value="duel-prone">Бой без ног (ИИ)</option><option value="damage">Здоровье и повреждения</option><option value="corpse">Обездвиженный пациент</option><option value="fall">Падение при столкновении</option><option value="terrain-hill">P4 — холм и наклонные опоры</option><option value="walk">Ходьба — один пациент</option><option value="one-leg">Одна нога</option><option value="arms">Без ног</option><option value="one-arm">Одна рука</option><option value="stump">Остаток плеча</option><option value="head">Голова и туловище</option><option value="torso">Только туловище</option></select></label> <label>Пациенты: <select id="patient-count"><option value="full">3</option><option value="2">2</option></select></label></p><p><label>Seed ринга: <input id="round-seed" type="number" min="0" max="4294967295" value="7" style="width:92px"></label> <button id="new-seed" title="Новая последовательность решений и характеристик; сохранённый пол восстанавливается">Другой seed</button></p><p><label>Камера: <select id="camera-mode"><option value="close">Ближняя</option><option value="overview">Весь ринг</option><option value="head">GoPro — голова</option></select></label> <label>Пациент: <select id="camera-patient" disabled></select></label> <label>FOV: <select id="camera-fov" disabled><option value="75">75°</option><option value="90" selected>90°</option><option value="105">105°</option></select></label></p><p><label><input type="checkbox" id="support-debug"> Опоры и центр массы</label> <label><input type="checkbox" id="terrain-debug"> Конусы тел и конечностей</label></p><p><label><input type="checkbox" id="vision-debug"> Поле зрения</label></p><p><label><input type="checkbox" id="route-debug"> Маршруты пациентов</label></p><p id="damage-controls" hidden><label>Сегмент: <select id="damage-segment"></select></label> <button id="damage-hit">Удар (1)</button> <button id="damage-crit">Крит (2)</button> <span id="damage-hp"></span></p><p id="motion-status" hidden></p><p id="floor-status">Сброс очищает пол. Следующий раунд сохраняет только остановившиеся останки.</p><p id="stats" data-build="dev">Подготовка запуска…</p><pre id="error-detail" style="white-space:pre-wrap;max-width:80vw;overflow-wrap:anywhere"></pre></div><script type="importmap">{"imports":{"three":"./vendor/three.module.js","@rapier":"./vendor/rapier.es.js"}}</script><script>
(()=>{const stats=document.getElementById('stats');let stage='Подготовка запуска',finished=false;
 const show=(s)=>{stage=s;stats.textContent=s;stats.dataset.state='loading';};
 const fail=(e)=>{finished=true;clearTimeout(watchdog);stats.dataset.state='error';stats.textContent='Ошибка ('+stage+'): '+(e?.message||String(e))+' — нажмите Сброс или обновите страницу.';const stack=typeof e?.stack==='string'?e.stack.split('\n').slice(0,4).join('\n'):'';document.getElementById('error-detail').textContent=stack;console.error(e);};
 const ready=()=>{finished=true;clearTimeout(watchdog);stats.dataset.state='running';document.getElementById('error-detail').textContent='';};
 const watchdog=setTimeout(()=>{if(!finished)stats.textContent='Загрузка заняла больше 20 секунд: '+stage+'. Проверьте WebGL или обновите страницу.';},20000);
 window.labStartup={show,fail,ready};
 window.addEventListener('error',e=>fail(e.error||e.message));window.addEventListener('unhandledrejection',e=>fail(e.reason));
 show('Загрузка локальных модулей Three.js и Rapier…');
 import('./rig.js').catch(fail);
})();
</script></body></html>
