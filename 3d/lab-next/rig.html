<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ЭКЦЕПРИ / Lab Next 3D</title><style>body{margin:0;background:#0b1410;color:#c4d5c8;font:14px system-ui}#hud{position:fixed;top:12px;left:12px;background:#0b1410e8;padding:12px;z-index:1}button,a{color:#c4d5c8;background:#20382b;padding:6px}canvas{display:block}</style></head><body><div id="hud"><b>LAB NEXT / P3 — COMBAT / RIG</b><p>W/S — движение, A/D — поворот, Shift — бег.</p><button id="pause">Пауза</button> <button id="reset">Сброс</button> <a href="./">Карта</a> <a href="../lab/">04.1</a><p><label>Сценарий: <select id="scenario"><option value="arena">Арена — 8 пациентов (ИИ)</option><option value="arena-escape">Арена — поиск выхода (ИИ)</option><option value="normal">Обычный</option><option value="duel">Бой 1 на 1 (руки)</option><option value="duel-mixed">Бой 1 на 1 (руки, ноги, голова)</option><option value="duel-traits">Бой 1 на 1 (характеристики)</option><option value="duel-prone">Бой без ног (ИИ)</option><option value="damage">Здоровье и повреждения</option><option value="corpse">Обездвиженный пациент</option><option value="fall">Падение при столкновении</option><option value="walk">Ходьба — один пациент</option><option value="one-leg">Одна нога</option><option value="arms">Без ног</option><option value="one-arm">Одна рука</option><option value="stump">Остаток плеча</option><option value="head">Голова и туловище</option><option value="torso">Только туловище</option></select></label></p><p><label><input type="checkbox" id="support-debug"> Опоры и центр массы</label> <label><input type="checkbox" id="terrain-debug"> Конусы тел и конечностей</label></p><p id="damage-controls" hidden><label>Сегмент: <select id="damage-segment"></select></label> <button id="damage-hit">Удар (1)</button> <button id="damage-crit">Крит (2)</button> <span id="damage-hp"></span></p><p id="stats" data-build="dev">Подготовка запуска…</p><pre id="error-detail" style="white-space:pre-wrap;max-width:80vw;overflow-wrap:anywhere"></pre></div><script type="importmap">{"imports":{"three":"./vendor/three.module.js","@rapier":"./vendor/rapier.es.js"}}</script><script>
(()=>{const stats=document.getElementById('stats');let stage='Подготовка запуска',finished=false;
 const show=(s)=>{stage=s;stats.textContent=s;stats.dataset.state='loading';};
 const fail=(e)=>{finished=true;clearTimeout(watchdog);stats.dataset.state='error';stats.textContent='Ошибка ('+stage+'): '+(e?.message||String(e))+' — нажмите Сброс или обновите страницу.';const stack=typeof e?.stack==='string'?e.stack.split('\n').slice(0,4).join('\n'):'';document.getElementById('error-detail').textContent=stack;console.error(e);};
 const ready=()=>{finished=true;clearTimeout(watchdog);stats.dataset.state='running';document.getElementById('error-detail').textContent='';};
 const watchdog=setTimeout(()=>{if(!finished)stats.textContent='Загрузка заняла больше 20 секунд: '+stage+'. Проверьте WebGL или обновите страницу.';},20000);
 window.labStartup={show,fail,ready};
 window.addEventListener('error',e=>fail(e.error||e.message));window.addEventListener('unhandledrejection',e=>fail(e.reason));
 show('Загрузка локальных модулей Three.js и Rapier…');
 import('./rig.js').catch(fail);
})();
</script></body></html>
