name: 3D preview Pages
on:
  push:
    branches: [feat/3d-simulation-core-bootstrap]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix 3d/core --no-audit --no-fund
      - run: npm --prefix 3d/core test
      - run: |
          mkdir -p _site/3d/core
          cp 3d/index.html _site/3d/
          cp -r 3d/lab 3d/lab-next _site/3d/
          cp -r 3d/core/dist _site/3d/core/
          cp 3d/index.html _site/index.html
          sed -i 's|href="./lab/|href="./3d/lab/|g; s|href="./lab-next/|href="./3d/lab-next/|g' _site/index.html
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
