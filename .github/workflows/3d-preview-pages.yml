name: 3D preview Pages
on:
  push:
    branches: [feat/3d-simulation-core-bootstrap]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    # Pin a Playwright 1.56 supported distribution; ubuntu-latest moved to 26.04.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix 3d/core --no-audit --no-fund
      - run: npm --prefix 3d/core test
      - name: Record core CPU benchmark (informational)
        run: node 3d/core/scripts/benchmark-core.mjs
      - name: Record Rapier ragdoll CPU benchmark (informational)
        run: node 3d/core/scripts/benchmark-ragdoll.mjs
      - name: Audit P4 authored arenas for 60 simulated seconds at full capacity
        timeout-minutes: 15
        env:
          P4_AUDIT_SECONDS: '60'
        run: node 3d/core/scripts/audit-authored-arenas.mjs
      - name: Upload P4 capacity and Rapier performance audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: authored-arena-audit
          path: 3d/core/authored-arena-audit.json
          if-no-files-found: warn
      - name: Audit full combat cycles with Rapier (six seeded cases)
        run: node 3d/core/scripts/audit-combat-cycle.mjs
      - name: Upload P3 integrated combat audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: combat-audit
          path: 3d/core/combat-audit-report.json
          if-no-files-found: warn
      - run: npm --prefix 3d/core run preview:stage
      - run: npx --prefix 3d/core playwright install --with-deps chromium
      - run: npm --prefix 3d/core run preview:smoke
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment_retry.outputs.page_url || steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages (initial)
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Back off after Pages API error
        if: steps.deployment.outcome == 'failure'
        run: sleep 20
      - name: Retry failed Pages deployment once
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
